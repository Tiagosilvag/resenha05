server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets com hash no nome — cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA — qualquer rota cai no index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# A API roda como um app separado no Coolify (domínio próprio), e o front fala
# com ela por VITE_API_URL. Se um dia quiser servir tudo no mesmo domínio,
# adicione aqui um `location /api/ { proxy_pass http://<api>:3000; }` com os
# dois containers na mesma rede interna do Coolify.
