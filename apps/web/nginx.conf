server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets com hash no nome — cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # /api → container "api" na mesma rede do docker-compose.
  # Resolver do Docker (127.0.0.11) + variável no proxy_pass: o nginx não trava
  # o start se o container "api" ainda não estiver de pé.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:3000";
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;           # SSE (lista ao vivo, Fase 7B)
  }

  # SPA — qualquer rota cai no index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
