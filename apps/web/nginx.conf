server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets com hash no nome — cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API → container resenha05-api (mesma rede interna do Coolify).
  # Ajuste o host/porta conforme o nome do serviço no Coolify, se preciso.
  location /api/ {
    proxy_pass http://resenha05-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # SSE (lista ao vivo, Fase 7B)
    proxy_buffering off;
  }

  # SPA — qualquer rota cai no index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
