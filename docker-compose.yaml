# =============================================================================
# Resenha05 — stack num recurso só (Coolify: build pack "Docker Compose")
# =============================================================================
# 2 containers de app (API + web) + bgremove. O Postgres NÃO sobe mais aqui —
# fica no recurso Coolify separado "postgresql-database-geral" (banco/role
# dedicados: resenha05 / resenha05_app), compartilhado com outros apps do
# mesmo servidor. Ver db/migrations/ para o schema.
#
# No Coolify, defina estas variáveis (Environment Variables):
#   DATABASE_URL            postgres://resenha05_app:<senha>@host.docker.internal:5432/resenha05?sslmode=require
#   JWT_SECRET               openssl rand -base64 48
#   JWT_REFRESH_SECRET       openssl rand -base64 48
#   RESENHA05_ENC_KEY        openssl rand -base64 32   (exatamente 32 bytes)
#   WEB_ORIGIN               https://resenha05.coffetech.com.br
#
# As fotos de perfil ficam no volume `avatars` (servidas pela própria API).
#
# E aponte o domínio (resenha05.coffetech.com.br) para o serviço "web", porta 80.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL (postgres externo)}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RESENHA05_ENC_KEY: ${RESENHA05_ENC_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://resenha05.coffetech.com.br}
      UPLOADS_DIR: /data/uploads
      # Recorte de fundo da foto (card estilo FIFA) — container interno abaixo.
      BGREMOVE_URL: http://bgremove:7000
    volumes:
      - avatars:/data/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '80'

  # Recorte de fundo da foto de perfil. Só a API fala com ele (rede interna);
  # a foto não sai do servidor. Teto de memória pra não brigar com o resto do host.
  bgremove:
    build:
      context: ./services/bgremove
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ORT_THREADS: '2'
    mem_limit: 768m
    cpus: 1.5
    expose:
      - '7000'

volumes:
  avatars:
